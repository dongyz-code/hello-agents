services:
  embedding:
    build:
      context: ./embedding-server
      dockerfile: Dockerfile
    container_name: hello-agent-embedding
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=BAAI/bge-small-zh-v1.5
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hello-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    depends_on:
      - embedding

volumes:
  qdrant_data:
    name: hello-agent-qdrant-data
  huggingface_cache:
    name: hello-agent-huggingface-cache